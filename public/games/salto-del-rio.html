<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salto del Río</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --leaf:#6db86d;--sun:#f0c060;--cream:#f5f0e8;
  --ui-bg:rgba(10,22,10,0.93);--ui-border:rgba(109,184,109,0.25);
}
body{
  background:#0c160c;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100%;font-family:'Space Mono',monospace;
  overflow:hidden;user-select:none;
}
html,body{height:100%;margin:0;}
#wrap{position:relative;width:820px;max-width:100vw;}

/* HUD */
#hud{
  display:flex;justify-content:space-between;align-items:center;
  padding:7px 2px;color:var(--cream);
}
.hud-group{display:flex;gap:22px;}
.hud-item{font-size:9px;color:rgba(245,240,232,.38);text-transform:uppercase;letter-spacing:.1em;}
.hud-val{font-size:16px;font-weight:700;color:var(--leaf);}
#stars-hud{display:flex;gap:5px;align-items:center;}
.si{font-size:20px;filter:grayscale(1);opacity:.25;transition:all .3s;}
.si.on{filter:none;opacity:1;transform:scale(1.18);}

canvas{display:block;border-radius:10px;border:1px solid rgba(109,184,109,.2);cursor:crosshair;}

/* Overlay */
#overlay{
  position:absolute;top:38px;left:0;right:0;
  display:flex;align-items:center;justify-content:center;
  pointer-events:none;z-index:10;
}
.ov-box{
  background:var(--ui-bg);border:1px solid var(--ui-border);
  border-radius:12px;padding:26px 40px;text-align:center;
  backdrop-filter:blur(14px);pointer-events:all;max-width:400px;
}
.ov-title{font-family:'Lora',serif;font-size:24px;color:var(--cream);margin-bottom:8px;}
.ov-sub{font-size:11px;color:rgba(245,240,232,.42);letter-spacing:.06em;
  margin-bottom:20px;line-height:1.9;}
.ov-score{font-family:'Lora',serif;font-size:22px;color:var(--sun);margin:4px 0 14px;}
.ov-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.ov-btn{
  font-family:'Space Mono',monospace;font-size:11px;padding:9px 24px;
  background:var(--leaf);color:#1a2e1a;border:none;border-radius:6px;
  cursor:pointer;font-weight:700;letter-spacing:.07em;transition:opacity .2s;
}
.ov-btn:hover{opacity:.82;}
.ov-btn.sec{background:transparent;color:var(--leaf);border:1px solid var(--ui-border);}

#bottom-bar{
  display:flex;justify-content:space-between;align-items:center;
  padding:6px 2px;
}
.hint-txt{font-size:10px;color:rgba(245,240,232,.28);letter-spacing:.06em;}
#btn-menu{
  font-family:'Space Mono',monospace;font-size:10px;padding:5px 13px;
  background:transparent;color:var(--leaf);border:1px solid rgba(109,184,109,.22);
  border-radius:6px;cursor:pointer;
}
#btn-menu:hover{background:rgba(109,184,109,.08);}
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <div class="hud-group">
      <div><div class="hud-item">Puntos</div><div class="hud-val" id="h-score">0</div></div>
      <div><div class="hud-item">Récord</div><div class="hud-val" id="h-hi">0</div></div>
      <div><div class="hud-item">Saltos</div><div class="hud-val" id="h-att">0</div></div>
    </div>
    <div id="stars-hud">
      <!-- estrellas dinámicas, no fijas por nivel -->
    </div>
  </div>

  <canvas id="c" width="820" height="460"></canvas>

  <div id="overlay"></div>

  <div id="bottom-bar">
    <div class="hint-txt" id="hint-txt">Arrastra desde el personaje para saltar</div>
    <button id="btn-menu">☰ menú</button>
  </div>
</div>

<script>
const cv = document.getElementById('c');
const cx = cv.getContext('2d');
const W = cv.width, H = cv.height;

// ── Física ──────────────────────────────────────────────────────────────────
const G   = 0.38;   // gravedad canvas px/frame²
const SCALE = 30;   // px por unidad lógica (para mostrar ecuación)
const PR  = 13;
const MAX_POWER = 17;

// ── Estado ──────────────────────────────────────────────────────────────────
let gstate = 'menu'; // menu | idle | flying | over
let score = 0, hiScore = 0, jumpCount = 0;
let player, infPlatforms, infStars, proj, particles = [];
let drag = {on:false, sx:0, sy:0, cx2:0, cy2:0};
let wAnim = 0, raf;
let camY = 0;
// Ecuación del último salto (o del arrastre actual)
let lastEq = {a:null, b:null, vx:null, vy:null};

const GY = H - 70; // y canvas del suelo base

// ── Generador de plataformas ─────────────────────────────────────────────────
function genChunk(baseY) {
  const pls = [], sts = [];
  pls.push({x:0, y:baseY, w:120});
  let curX = 80, curY = baseY;
  for(let i = 0; i < 5; i++){
    const gap  = 120 + Math.random() * 100;
    const rise = 50  + Math.random() * 100;
    const w    = 65  + Math.random() * 60;
    curX += gap; curY -= rise;
    if(curX + w > W - 15) curX = 25 + Math.random() * 80;
    pls.push({x:curX, y:curY, w});
    if(Math.random() < 0.65)
      sts.push({x: curX + w/2, y: curY - 38, collected: false});
  }
  return {platforms:pls, stars:sts};
}

// ── Init ─────────────────────────────────────────────────────────────────────
let trees = [], bgTrees = [];

function buildDecor(){
  trees = []; bgTrees = [];
  for(let i = 0; i < 7; i++)
    bgTrees.push({x:30+i*120+Math.random()*50, y:GY, h:55+Math.random()*50, r:Math.random()});
  trees.push({x:26, y:GY, h:100});
  trees.push({x:798, y:GY, h:82});
}

function initGame(){
  score = 0; jumpCount = 0; proj = null; particles = []; camY = 0;
  lastEq = {a:null, b:null, vx:null, vy:null};
  const chunk = genChunk(GY);
  infPlatforms = chunk.platforms;
  infStars     = chunk.stars;
  const sp = infPlatforms[0];
  player = {x: sp.x + sp.w - 40, y: sp.y - PR*2, groundY: sp.y};
  buildDecor();
  updateHUD();
  gstate = 'idle';
}

function updateHUD(){
  document.getElementById('h-score').textContent = score;
  document.getElementById('h-att').textContent   = jumpCount;
  if(score > hiScore) hiScore = score;
  document.getElementById('h-hi').textContent    = hiScore;
}

function setHint(t){ document.getElementById('hint-txt').textContent = t; }

// ── Ecuación a mostrar ───────────────────────────────────────────────────────
// Dado vx_canvas y vy_canvas (velocidades en px/frame), calculamos
// los coeficientes a y b de f(x) = ax² + bx  con origen en el jugador.
//
//   x_m = dx_canvas / SCALE        (distancia horizontal en lu)
//   y_m = -dy_canvas / SCALE       (altura en lu, Y invertido)
//
//   x_m(t) = vx_m · t             (vx_m = vx_c / SCALE)
//   y_m(t) = vy_m · t - ½·G_m·t² (G_m = G/SCALE, vy_m = -vy_c/SCALE)
//
//   Eliminando t:  t = x_m / vx_m
//   y_m = (vy_m/vx_m)·x_m - (G_m/(2·vx_m²))·x_m²
//
//   → b = vy_m / vx_m    (pendiente inicial = tangente en x=0)
//   → a = -G_m / (2·vx_m²)   (siempre negativo)

function computeEq(vx_c, vy_c){
  const vxm =  vx_c / SCALE;
  const vym = -vy_c / SCALE;  // invertir Y
  const Gm  =  G    / SCALE;
  if(Math.abs(vxm) < 0.001) return null;
  const a = -Gm / (2 * vxm * vxm);
  const b =  vym / vxm;
  return {a, b};
}

// ── Dibujar ecuación en canvas ───────────────────────────────────────────────
function drawEquation(){
  // Siempre visible en la esquina inferior izquierda del canvas
  const eq = lastEq;
  if(eq.a === null && gstate !== 'flying') {
    // Si está arrastrando, calcular en tiempo real
    if(gstate === 'idle' && drag.on){
      const dx = drag.sx - drag.cx2, dy = drag.sy - drag.cy2;
      const dist = Math.hypot(dx, dy);
      if(dist < 8) return;
      const power = Math.min(dist / 5, MAX_POWER);
      const vx_c = (dx/dist)*power, vy_c = (dy/dist)*power;
      const r = computeEq(vx_c, vy_c);
      if(!r) return;
      renderEqOnCanvas(r.a, r.b, true);
    }
    return;
  }
  if(eq.a === null) return;
  renderEqOnCanvas(eq.a, eq.b, false);
}

function renderEqOnCanvas(a, b, isPreview){
  const bAbs = Math.abs(b).toFixed(1);
  const bSign = b >= 0 ? '+' : '−';
  const aStr = a.toFixed(1);
  const text = `f(x) = ${aStr}x²  ${bSign}  ${bAbs}x`;

  cx.save();

  // Fondo semitransparente para legibilidad
  cx.font = 'bold 18px Lora, serif';
  const tw = cx.measureText(text).width;
  const px = 16, py = H - 18;
  const padX = 14, padY = 8;

  cx.fillStyle = isPreview
    ? 'rgba(20,40,20,0.55)'
    : 'rgba(20,40,20,0.65)';
  cx.beginPath();
  cx.roundRect(px - padX, py - 22 - padY, tw + padX*2, 22 + padY*2, 6);
  cx.fill();

  // Texto: tono más claro que el fondo pero sin ser el color de acento
  cx.fillStyle = isPreview
    ? 'rgba(180,220,160,0.45)'   // preview = muy sutil
    : 'rgba(200,235,180,0.72)';  // post-salto = visible pero suave
  cx.fillText(text, px, py);

  // Indicador "preview" o vértice
  if(isPreview){
    cx.font = '9px Space Mono';
    cx.fillStyle = 'rgba(180,220,160,0.3)';
    cx.fillText('← en tiempo real', px + tw + padX + 4, py);
  } else {
    // Mostrar vértice
    const xv = -b / (2*a);
    const yv =  a*xv*xv + b*xv;
    cx.font = '9px Space Mono';
    cx.fillStyle = 'rgba(240,192,96,0.45)';
    cx.fillText(`vértice (${xv.toFixed(1)}, ${yv.toFixed(1)})`, px, py + 16);
  }

  cx.restore();
}

// ── Física proyectil ─────────────────────────────────────────────────────────
function stepProj(){
  if(!proj) return;
  proj.trail.push({x:proj.x, y:proj.y});
  if(proj.trail.length > 30) proj.trail.shift();
  proj.x += proj.vx; proj.y += proj.vy; proj.vy += G;

  // Colisión estrellas
  for(const s of infStars){
    if(s.collected) continue;
    const sy = s.y + camY;
    if(Math.hypot(proj.x - s.x, proj.y - sy) < 22){
      s.collected = true;
      spawnStarBurst(s.x, sy);
      score += 100;
      updateHUD();
    }
  }

  // Colisión plataformas
  for(let i = 0; i < infPlatforms.length; i++){
    const pl  = infPlatforms[i];
    const ply = pl.y + camY;
    if(proj.x+PR > pl.x+4 && proj.x-PR < pl.x+pl.w-4 &&
       proj.y+PR >= ply-2  && proj.y+PR <= ply+14 && proj.vy > 0){
      landOn(i); return;
    }
  }

  // Caída al vacío
  if(proj.y > H + 60){
    splashAt(proj.x, H - 50);
    proj = null; gstate = 'idle';
    if(player.y + camY > H + 100){ gameOver(); return; }
    setHint('¡Al agua! Intenta de nuevo');
  }
}

function landOn(idx){
  const pl  = infPlatforms[idx];
  const ply = pl.y + camY;
  player.x       = proj.x;
  player.y       = ply - PR*2;
  player.groundY = ply;
  proj = null; gstate = 'idle';
  spawnLeaves(player.x, player.y + PR*2);
  score += 10; jumpCount++;
  updateHUD();
  scrollCamera(ply);

  // Generar más plataformas arriba si hace falta
  const topY = Math.min(...infPlatforms.map(p => p.y));
  if(topY + camY > 100){
    const chunk = genChunk(topY - 30);
    infPlatforms.push(...chunk.platforms);
    infStars.push(...chunk.stars.map(s=>({...s, collected:false})));
  }
  // Limpiar plataformas muy abajo
  infPlatforms = infPlatforms.filter(p => p.y + camY < H + 180);
  infStars     = infStars.filter(s  => !s.collected && s.y + camY < H + 180);

  setHint('Arrastra desde el personaje para saltar');
}

function scrollCamera(newPlayerY){
  const threshold = H * 0.42;
  if(newPlayerY < threshold){
    const delta = threshold - newPlayerY;
    camY           += delta;
    player.y       += delta;
    player.groundY += delta;
  }
}

function gameOver(){
  gstate = 'over';
  if(score > hiScore) hiScore = score;
  document.getElementById('overlay').innerHTML = `
  <div class="ov-box">
    <div class="ov-title">¡Caíste!</div>
    <div class="ov-score">${score} pts</div>
    <div class="ov-sub">
      Récord: ${hiScore} pts &nbsp;·&nbsp; ${jumpCount} saltos<br>
      Cada salto siguió <em style="color:rgba(200,235,180,.7)">f(x) = ax² + bx</em> con a &lt; 0
    </div>
    <div class="ov-btns">
      <button class="ov-btn" id="ov-retry">Intentar de nuevo</button>
    </div>
  </div>`;
  document.getElementById('ov-retry').addEventListener('click', ()=>{
    document.getElementById('overlay').innerHTML='';
    initGame(); loop();
  });
}

function showMenu(){
  gstate = 'menu';
  document.getElementById('overlay').innerHTML = `
  <div class="ov-box">
    <div class="ov-title">Salto del Río</div>
    <div class="ov-sub">
      Arrastra desde el personaje para definir el salto.<br>
      La <em style="color:rgba(200,235,180,.7)">función cuadrática</em> de tu trayectoria<br>
      aparece siempre en pantalla.<br>
      Recoge estrellas y sube lo más alto posible.
    </div>
    <div class="ov-btns">
      <button class="ov-btn" id="ov-start">Comenzar</button>
    </div>
  </div>`;
  document.getElementById('ov-start').addEventListener('click', ()=>{
    document.getElementById('overlay').innerHTML='';
    initGame(); loop();
  });
}

document.getElementById('btn-menu').addEventListener('click', showMenu);

// ── Partículas ────────────────────────────────────────────────────────────────
function splashAt(x, y){
  for(let i = 0; i < 18; i++){
    const a = -Math.PI + Math.random()*Math.PI, s = 1.5 + Math.random()*3.5;
    particles.push({x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s-2.5, life:1, type:'water'});
  }
}
function spawnLeaves(x, y){
  for(let i = 0; i < 10; i++){
    const a = -Math.PI + Math.random()*Math.PI;
    particles.push({x, y, vx:Math.cos(a)*2.2, vy:Math.sin(a)*2.2-1.5, life:1, type:'leaf'});
  }
}
function spawnStarBurst(x, y){
  for(let i = 0; i < 20; i++){
    const a = (Math.PI*2/20)*i;
    particles.push({x, y, vx:Math.cos(a)*3.8, vy:Math.sin(a)*3.8-1, life:1, type:'star'});
  }
}
function stepParticles(){
  for(const p of particles){ p.x+=p.vx; p.y+=p.vy; p.vy+=.14; p.life-=.03; }
  particles = particles.filter(p => p.life > 0);
}

// ── Dibujo ────────────────────────────────────────────────────────────────────
const COL = {
  gDark:'#263820', grass:'#578034', grassL:'#78b040',
  water:'#1e4a78', waterL:'#4888c4', waterFoam:'#8fc0e0',
  bark:'#5a3e2b', leafD:'#1e5025', leafM:'#2d7535', leafL:'#4aaa46', leafHL:'#6ecc5e',
  char:'#e8c870', charOut:'#4a2e18', star:'#f0c060',
};

function drawBg(){
  const sk = cx.createLinearGradient(0,0,0,H*.6);
  sk.addColorStop(0,'#121c12'); sk.addColorStop(1,'#223822');
  cx.fillStyle=sk; cx.fillRect(0,0,W,H);
  cx.save(); cx.globalAlpha=.05;
  const sg = cx.createRadialGradient(W*.62,35,0,W*.62,35,280);
  sg.addColorStop(0,'#f0e090'); sg.addColorStop(1,'transparent');
  cx.fillStyle=sg; cx.fillRect(0,0,W,H); cx.restore();
}

function drawBgTrees(){
  for(const t of bgTrees){
    const ty = t.y + camY;
    cx.save(); cx.globalAlpha=.2;
    cx.fillStyle=COL.bark; cx.fillRect(t.x-5, ty-t.h+16, 8, t.h);
    cx.fillStyle=COL.leafD; cx.beginPath(); cx.arc(t.x, ty-t.h+6, 26+t.r*10, 0, Math.PI*2); cx.fill();
    cx.restore();
  }
}

function drawPlatform(pl){
  const py = pl.y + camY;
  if(py > H+30 || py < -50) return;
  cx.fillStyle=COL.gDark; cx.beginPath(); cx.roundRect(pl.x, py, pl.w, 20, 3); cx.fill();
  cx.save(); cx.globalAlpha=.15; cx.fillStyle='#000';
  cx.beginPath(); cx.ellipse(pl.x+pl.w/2, py+25, pl.w/2-4, 5, 0, 0, Math.PI*2); cx.fill(); cx.restore();
  cx.fillStyle=COL.grass; cx.fillRect(pl.x, py-5, pl.w, 8);
  cx.strokeStyle=COL.grassL; cx.lineWidth=1.5;
  for(let i = 0; i < Math.floor(pl.w/17); i++){
    const gx = pl.x+9+i*17;
    cx.beginPath(); cx.moveTo(gx, py-5); cx.lineTo(gx-2, py-13); cx.stroke();
    cx.beginPath(); cx.moveTo(gx+5, py-5); cx.lineTo(gx+8, py-14); cx.stroke();
  }
}

function drawPlatforms(){
  for(const pl of infPlatforms) drawPlatform(pl);
}

function drawTrees(){
  for(const t of trees){
    const ty = t.y + camY;
    cx.fillStyle=COL.bark; cx.beginPath(); cx.roundRect(t.x-7, ty-t.h, 14, t.h, 3); cx.fill();
    [[34,0],[26,-24],[18,-45]].forEach(([r,dy])=>{
      cx.fillStyle=COL.leafD; cx.beginPath(); cx.arc(t.x, ty-t.h+16+dy, r, 0, Math.PI*2); cx.fill();
      cx.fillStyle=COL.leafM; cx.beginPath(); cx.arc(t.x+5, ty-t.h+10+dy, r*.6, 0, Math.PI*2); cx.fill();
    });
    cx.fillStyle=COL.leafHL; cx.globalAlpha=.36;
    cx.beginPath(); cx.arc(t.x+8, ty-t.h-17, 7, 0, Math.PI*2); cx.fill(); cx.globalAlpha=1;
  }
}

function drawStar5(x, y, r){
  cx.save(); cx.fillStyle=COL.star; cx.strokeStyle='rgba(200,140,20,.4)'; cx.lineWidth=1;
  cx.beginPath();
  for(let i = 0; i < 5; i++){
    const a = -Math.PI/2+(Math.PI*2/5)*i, ia = a+Math.PI/5;
    i===0 ? cx.moveTo(x+Math.cos(a)*r, y+Math.sin(a)*r)
           : cx.lineTo(x+Math.cos(a)*r, y+Math.sin(a)*r);
    cx.lineTo(x+Math.cos(ia)*r*.42, y+Math.sin(ia)*r*.42);
  }
  cx.closePath(); cx.fill(); cx.stroke(); cx.restore();
}

function drawStars(){
  const pulse = Math.sin(wAnim*.08)*2.5;
  for(const s of infStars){
    if(s.collected) continue;
    const sy = s.y + camY;
    if(sy > H+20 || sy < -20) continue;
    cx.save(); cx.globalAlpha=.28+Math.sin(wAnim*.06)*.1;
    const g = cx.createRadialGradient(s.x, sy, 0, s.x, sy, 18);
    g.addColorStop(0,'rgba(240,192,96,.5)'); g.addColorStop(1,'transparent');
    cx.fillStyle=g; cx.beginPath(); cx.arc(s.x, sy, 18, 0, Math.PI*2); cx.fill(); cx.restore();
    drawStar5(s.x, sy+pulse*.3, 12+pulse*.22);
  }
}

function drawAim(){
  if(gstate !== 'idle' || !drag.on) return;
  const px=player.x, py=player.y+PR;
  const dx=drag.sx-drag.cx2, dy=drag.sy-drag.cy2;
  const dist = Math.hypot(dx, dy);
  if(dist < 4) return;
  const power = Math.min(dist/5, MAX_POWER);
  const vx=(dx/dist)*power, vy=(dy/dist)*power;

  // Actualizar ecuación en tiempo real mientras se arrastra
  const eq = computeEq(vx, vy);
  if(eq) { lastEq.a = eq.a; lastEq.b = eq.b; }

  // Dots de trayectoria
  let sx=px, sy=py, svx=vx, svy=vy;
  cx.save();
  for(let i = 0; i < 65; i++){
    sx+=svx; sy+=svy; svy+=G;
    if(i%2===0){
      cx.globalAlpha=(1-i/65)*.68; cx.fillStyle=COL.char;
      cx.beginPath(); cx.arc(sx, sy, 3.5*(1-i/65)+1.2, 0, Math.PI*2); cx.fill();
    }
    if(sy > H+20) break;
  }
  cx.restore();

  // Línea de arrastre
  cx.save(); cx.strokeStyle='rgba(240,192,96,.15)'; cx.lineWidth=1.5; cx.setLineDash([4,6]);
  cx.beginPath(); cx.moveTo(drag.sx, drag.sy); cx.lineTo(drag.cx2, drag.cy2); cx.stroke(); cx.restore();

  // Barra de potencia
  const pct=power/MAX_POWER, bx=drag.sx-22, by2=drag.sy-32;
  cx.fillStyle='rgba(0,0,0,.35)'; cx.beginPath(); cx.roundRect(bx, by2, 44, 7, 3); cx.fill();
  cx.fillStyle=pct>.7?'#e07070':pct>.4?COL.star:'#6db86d';
  cx.beginPath(); cx.roundRect(bx, by2, 44*pct, 7, 3); cx.fill();
}

function drawPlayer(){
  const px=player.x, py=player.y;
  const bob = Math.sin(wAnim*.06)*1.2;
  cx.save(); cx.globalAlpha=.16; cx.fillStyle='#000';
  cx.beginPath(); cx.ellipse(px, player.groundY+2, 11, 3.5, 0, 0, Math.PI*2); cx.fill(); cx.restore();
  const by = py+bob;
  cx.fillStyle='#4a6a2a'; cx.beginPath(); cx.roundRect(px-9, by+13, 18, 13, 3); cx.fill();
  cx.fillStyle=COL.char; cx.beginPath(); cx.arc(px, by+8, 11, 0, Math.PI*2); cx.fill();
  cx.strokeStyle=COL.charOut; cx.lineWidth=1.5; cx.stroke();
  cx.fillStyle=COL.charOut;
  cx.beginPath(); cx.arc(px-4, by+7, 2, 0, Math.PI*2); cx.arc(px+4, by+7, 2, 0, Math.PI*2); cx.fill();
  cx.strokeStyle=COL.charOut; cx.lineWidth=1.5;
  cx.beginPath(); cx.arc(px, by+11, 3.5, .1, Math.PI-.1); cx.stroke();
  cx.fillStyle='#3d7530'; cx.beginPath(); cx.ellipse(px, by-1, 13, 4.5, 0, Math.PI, Math.PI*2); cx.fill();
  cx.fillStyle=COL.leafD; cx.beginPath(); cx.ellipse(px+5, by-3, 7.5, 3.5, -.3, 0, Math.PI*2); cx.fill();
}

function drawProjectile(){
  if(!proj) return;
  for(let i = 0; i < proj.trail.length; i++){
    const t=proj.trail[i];
    cx.save(); cx.globalAlpha=(i/proj.trail.length)*.48; cx.fillStyle=COL.char;
    cx.beginPath(); cx.arc(t.x, t.y, 3.5*(i/proj.trail.length)+1, 0, Math.PI*2); cx.fill(); cx.restore();
  }
  cx.save();
  cx.translate(proj.x, proj.y); cx.rotate(Math.atan2(proj.vy, proj.vx)*.4);
  cx.fillStyle='#4a6a2a'; cx.beginPath(); cx.roundRect(-9, 0, 18, 13, 3); cx.fill();
  cx.fillStyle=COL.char; cx.beginPath(); cx.arc(0, -4, 11, 0, Math.PI*2); cx.fill();
  cx.strokeStyle=COL.charOut; cx.lineWidth=1.5; cx.stroke();
  cx.fillStyle=COL.charOut;
  cx.beginPath(); cx.arc(-4, -5, 2, 0, Math.PI*2); cx.arc(4, -5, 2, 0, Math.PI*2); cx.fill();
  cx.restore();
}

function drawParticles(){
  for(const p of particles){
    cx.save(); cx.globalAlpha=p.life*.85;
    cx.fillStyle=p.type==='water'?COL.waterFoam:p.type==='star'?COL.star:COL.leafL;
    cx.beginPath(); cx.arc(p.x, p.y, p.type==='star'?4:3, 0, Math.PI*2); cx.fill(); cx.restore();
  }
}

// ── Input ─────────────────────────────────────────────────────────────────────
function getPos(e){
  const r = cv.getBoundingClientRect();
  if(e.touches) return {
    mx:(e.touches[0].clientX-r.left)*(W/r.width),
    my:(e.touches[0].clientY-r.top)*(H/r.height)
  };
  return {mx:(e.clientX-r.left)*(W/r.width), my:(e.clientY-r.top)*(H/r.height)};
}

cv.addEventListener('mousedown', e=>{
  if(gstate !== 'idle') return;
  const {mx,my} = getPos(e);
  if(Math.hypot(mx-player.x, my-(player.y+PR)) < 40){
    drag.on=true; drag.sx=player.x; drag.sy=player.y+PR; drag.cx2=mx; drag.cy2=my;
  }
});
cv.addEventListener('mousemove', e=>{
  if(!drag.on) return;
  const {mx,my}=getPos(e); drag.cx2=mx; drag.cy2=my;
});
cv.addEventListener('mouseup', e=>{
  if(!drag.on || gstate!=='idle') return;
  drag.on = false;
  const dx=drag.sx-drag.cx2, dy=drag.sy-drag.cy2;
  const dist = Math.hypot(dx,dy);
  if(dist < 8) return;
  const power = Math.min(dist/5, MAX_POWER);
  const vx_c = (dx/dist)*power, vy_c = (dy/dist)*power;
  // Calcular y guardar ecuación de este salto
  const eq = computeEq(vx_c, vy_c);
  if(eq) lastEq = {a:eq.a, b:eq.b};
  proj = {x:player.x, y:player.y+PR, vx:vx_c, vy:vy_c, trail:[]};
  gstate = 'flying'; jumpCount++; updateHUD();
});
cv.addEventListener('touchstart', e=>{
  e.preventDefault(); if(gstate!=='idle') return;
  const {mx,my}=getPos(e);
  if(Math.hypot(mx-player.x,my-(player.y+PR))<42){
    drag.on=true; drag.sx=player.x; drag.sy=player.y+PR; drag.cx2=mx; drag.cy2=my;
  }
},{passive:false});
cv.addEventListener('touchmove', e=>{
  e.preventDefault(); if(!drag.on) return;
  const {mx,my}=getPos(e); drag.cx2=mx; drag.cy2=my;
},{passive:false});
cv.addEventListener('touchend', e=>{
  if(!drag.on) return; drag.on=false;
  const dx=drag.sx-drag.cx2, dy=drag.sy-drag.cy2, dist=Math.hypot(dx,dy);
  if(dist<8) return;
  const power=Math.min(dist/5,MAX_POWER);
  const vx_c=(dx/dist)*power, vy_c=(dy/dist)*power;
  const eq=computeEq(vx_c,vy_c); if(eq) lastEq={a:eq.a,b:eq.b};
  proj={x:player.x,y:player.y+PR,vx:vx_c,vy:vy_c,trail:[]};
  gstate='flying'; jumpCount++; updateHUD();
});

// ── Loop ──────────────────────────────────────────────────────────────────────
function loop(){
  wAnim++;
  cx.clearRect(0,0,W,H);
  drawBg(); drawBgTrees(); drawPlatforms(); drawTrees(); drawStars();
  drawAim();
  if(proj){ stepProj(); drawProjectile(); } else if(gstate!=='menu') drawPlayer();
  stepParticles(); drawParticles();
  drawEquation(); // siempre al final, encima de todo
  raf = requestAnimationFrame(loop);
}

showMenu();
loop();
</script>
